<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Uses modern text encoding. -->
    <meta charset="UTF-8">

    <!-- Makes the page work well on phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Store Assistant</title>

    <style>
        /* The body controls the page background and text alignment. */
        body {
            font-family: Arial, sans-serif;
            background-color: #d7b98e;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        /* This is the assistant box. */
        .assistant {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            border: 4px solid #8b5e3c;
        }

        h1 {
            color: #b45309;
        }

        /* Each size choice is a clickable button. */
        .choice {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Changes the button color when the user points at it. */
        .choice:hover {
            background-color: #16a34a;
        }

        /* Link for going back to the store. */
        .back {
            display: inline-block;
            margin-top: 15px;
            color: #8b5e3c;
        }
    </style>
</head>

<body>
    <div class="assistant">
        <!-- Main heading of the assistant page. -->
        <h1>🥤 Store Assistant</h1>

        <p>What size would you like?</p>
        <p>Choose the amount that fits what you need:</p>

        <!-- These choices will be useful later when we add JavaScript. -->
        <a class="choice" href="#">250 mL - Small</a>
        <a class="choice" href="#">500 mL - Regular</a>
        <a class="choice" href="#">1 Liter - Large</a>
        <a class="choice" href="#">1.5 Liters - Family Size</a>

        <!-- Goes back to the main store page. -->
        <a class="back" href="index.html">← Back to Store</a>
    </div>
</body>
</html>
