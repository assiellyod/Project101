<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Uses modern text encoding. -->
    <meta charset="UTF-8">

    <!-- Makes the page work well on phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meat & Fish</title>

    <style>
        /* Basic page design. */
        body {
            font-family: Arial, sans-serif;
            background-color: #d7b98e;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        /* Main box for this product category. */
        .page {
            max-width: 650px;
            margin: auto;
            background-color: #fffdf5;
            border: 4px solid #8b5e3c;
            border-radius: 12px;
            padding: 20px;
        }

        h1 {
            color: #b45309;
        }

        /* Each product gets its own card. */
        .product {
            background-color: white;
            border: 2px solid #ddd;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
        }

        /* Back button returns to the main store. */
        .back {
            display: inline-block;
            margin-top: 15px;
            background-color: #8b5e3c;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>🥩 Meat, Fish & More</h1>
        <p>Welcome to our fresh products section!</p>

        <!-- Meat products. -->
        <div class="product">
            <h2>🥩 Beef</h2>
            <p>Fresh beef for your meals.</p>
        </div>

        <div class="product">
            <h2>🍗 Chicken</h2>
            <p>Fresh chicken for cooking.</p>
        </div>

        <!-- Fish products. -->
        <div class="product">
            <h2>🐟 Fish</h2>
            <p>Fresh fish for your meal.</p>
        </div>

        <div class="product">
            <h2>🦐 Seafood</h2>
            <p>More seafood choices coming soon.</p>
        </div>

        <a class="back" href="index.html">← Back to Store</a>
    </div>
</body>
</html>
