<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This tells the browser to use modern text encoding. -->
    <meta charset="UTF-8">

    <!-- This makes the website fit properly on phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- This is the name shown on the browser tab. -->
    <title>Juan's Sari-Sari Store</title>

    <style>
        /* CSS controls the design and appearance of the website. */
        body {
            font-family: Arial, sans-serif; /* Changes the text style. */
            background-color: #fff8dc;      /* Gives the page a light yellow background. */
            text-align: center;              /* Centers the text. */
            margin: 0;                       /* Removes default browser spacing. */
            padding: 20px;                   /* Adds space around the page. */
        }

        /* This is the main store container. */
        .store {
            max-width: 600px;                /* Keeps the store from becoming too wide. */
            margin: auto;                    /* Centers the container. */
            background-color: white;         /* Makes the store box white. */
            padding: 25px;                   /* Adds space inside the box. */
            border-radius: 15px;             /* Makes the corners rounded. */
        }

        /* This styles the store name. */
        h1 {
            color: #d97706;
            margin-bottom: 5px;
        }

        /* This creates a simple product card. */
        .product {
            border: 1px solid #ddd;          /* Adds a thin border around products. */
            padding: 15px;                   /* Adds space inside each product. */
            margin: 10px 0;                  /* Adds space between products. */
            border-radius: 10px;
        }

        /* This styles the product name. */
        .product h3 {
            margin: 5px;
        }

        /* This styles the Buy button. */
        button {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Changes the button when the mouse is placed over it. */
        button:hover {
            background-color: #d97706;
        }
    </style>
</head>

<body>
    <!-- Everything inside body is visible on the website. -->
    <div class="store">

        <!-- h1 is the biggest/main heading. -->
        <h1>🛒 Juan's Sari-Sari Store</h1>

        <!-- p is used for a paragraph or short description. -->
        <p>Welcome! Your neighborhood store.</p>

        <!-- h2 is a smaller heading than h1. -->
        <h2>Our Products</h2>

        <!-- Each product is placed inside its own product box. -->
        <div class="product">
            <h3>Coke</h3>
            <p>₱20</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h3>Lucky Me</h3>
            <p>₱15</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h3>Biscuits</h3>
            <p>₱10</p>
            <button>Buy Now</button>
        </div>

        <!-- This is a simple footer message. -->
        <p>Thank you for shopping with us!</p>
    </div>
</body>
</html>
